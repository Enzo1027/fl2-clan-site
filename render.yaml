services:
  - type: web
    name: fl2-clan-site
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: fl2-counter-data
      mountPath: /var/data
      sizeGB: 1
